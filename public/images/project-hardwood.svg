<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="95%">
      <stop offset="0" stop-color="#363636"/>
      <stop offset="0.6" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#111"/>
    </radialGradient>
    <radialGradient id="wood" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#2c2c2c"/>
    </radialGradient>
    <g id="log">
      <circle r="100" fill="url(#wood)" stroke="#4a4a4a" stroke-width="6"/>
      <g fill="none" stroke="#1d1d1d" stroke-opacity="0.75" stroke-width="3">
        <circle r="82"/><circle r="66" cx="2"/><circle r="50" cx="3" cy="-2"/><circle r="34" cx="4" cy="-3"/><circle r="18" cx="4" cy="-3"/>
      </g>
      <path d="M4 -3 L70 -60" stroke="#1d1d1d" stroke-opacity="0.6" stroke-width="3"/>
    </g>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <!-- stacked log ends -->
  <g transform="translate(150 260)">
    <use href="#log" x="110" y="440" />
    <use href="#log" x="320" y="440" />
    <use href="#log" x="530" y="440" />
    <use href="#log" x="215" y="262" />
    <use href="#log" x="425" y="262" />
    <use href="#log" x="320" y="84" />
  </g>
  <!-- highlighted log -->
  <g transform="translate(575 344)">
    <circle r="104" fill="none" stroke="#f7931e" stroke-width="6"/>
  </g>
  <!-- inventory panel -->
  <g transform="translate(800 170)">
    <rect width="300" height="560" rx="16" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="28" y="32" width="150" height="14" rx="7" fill="#5a5a5a"/>
    <g fill="#3a3a3a">
      <rect x="28" y="92" width="244" height="10" rx="5"/>
      <rect x="28" y="140" width="200" height="10" rx="5"/>
      <rect x="28" y="188" width="230" height="10" rx="5"/>
      <rect x="28" y="236" width="180" height="10" rx="5"/>
    </g>
    <rect x="28" y="140" width="120" height="10" rx="5" fill="#f7931e"/>
    <!-- auction bid -->
    <rect x="28" y="300" width="244" height="150" rx="12" fill="#232323" stroke="#333"/>
    <rect x="48" y="324" width="90" height="10" rx="5" fill="#5a5a5a"/>
    <path d="M48 420 96 396 140 404 188 370 252 352" fill="none" stroke="#f7931e" stroke-width="4" stroke-linejoin="round"/>
    <rect x="28" y="480" width="244" height="48" rx="24" fill="#f7931e"/>
    <rect x="104" y="499" width="92" height="10" rx="5" fill="#111"/>
  </g>
</svg>
